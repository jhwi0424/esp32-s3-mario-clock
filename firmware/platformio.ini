; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3-mario-usb
name = Clockwise

[env:native]
platform = native
test_framework = unity
test_ignore = test_embedded
; cw-commons depends on Arduino; native tests include its pure C++ headers by path.
lib_ignore = cw-commons

[env:esp32dev]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
test_ignore = test_native
monitor_speed = 115200
lib_deps = 
	https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git#3.0.12
	adafruit/Adafruit GFX Library@^1.10.1
	adafruit/Adafruit BusIO@^1.5.0
	SPI
	Wire
	ropg/ezTime@^0.8.3
	https://github.com/jnthas/Improv-WiFi-Library
	https://github.com/tzapu/WiFiManager
	bblanchon/ArduinoJson@^6.21.2
	bitbank2/PNGdec@^1.0.1
build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/> -<clockfaces/>
build_flags = 
	-D CW_FW_VERSION="\"1.4.4\""
	-D CW_FW_NAME="\"${sysenv.FW_NAME}\""

; ESP32-S3 N16R8, single 64x64 HUB75E, AnimatedPixelClock pin allocation.
[env:esp32s3-mario]
extends = env:esp32dev
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 460800
lib_deps =
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git#3.0.12
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
    ropg/ezTime@0.8.3
    https://github.com/jnthas/Improv-WiFi-Library.git#e37c244e0080349e191252acf4bce146eca118e0
    https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58
    bblanchon/ArduinoJson@6.21.6
    bitbank2/PNGdec@1.1.6
extra_scripts = pre:../tools/prepare_mario.py
build_flags =
    -D CW_FW_VERSION="\"1.4.4-s3\""
    -D CW_FW_NAME="\"Mario-S3-64x64\""
    -D CW_BOARD_ANIMATED_PIXEL_S3=1
    -D CLOCKFACE_NAME="\"cw-cf-0x01\""
    -D BOARD_HAS_PSRAM

; Use this environment for the S3 native USB-Serial/JTAG port.
[env:esp32s3-mario-usb]
extends = env:esp32s3-mario
build_flags =
    ${env:esp32s3-mario.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Independent color/timing diagnostic (does not start Wi-Fi).
[env:esp32s3-panel-test]
extends = env:esp32s3-mario-usb
lib_deps =
    https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-I2S-DMA.git#3.0.12
    adafruit/Adafruit GFX Library@1.13.0
    adafruit/Adafruit BusIO@1.17.4
extra_scripts =
lib_ignore = cw-commons, cw-gfx-engine, cw-cf-0x01
build_src_filter = -<*> +<panel_diagnostic.cpp>
build_flags =
    ${env:esp32s3-mario-usb.build_flags}
    -D CW_PANEL_DIAGNOSTIC=1
